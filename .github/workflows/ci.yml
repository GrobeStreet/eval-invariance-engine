name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and test runner
        run: pip install -e . pytest
      - name: Install pinned optional integration
        if: matrix.python-version != '3.9'
        run: pip install inspect_ai==0.3.290
      - name: Require optional integration on supported Python
        if: matrix.python-version != '3.9'
        run: python -c "import inspect_ai; print(inspect_ai.__version__)"
      - name: Run tests including offline mock evaluation
        run: python -m pytest -q
      - name: Run offline examples
        run: |
          python examples/demo.py
          invariance-check report examples/paired_results.json --json
