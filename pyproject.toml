[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-invariance-engine"
version = "0.2.0"
description = "Measure whether an AI eval score survives non-semantic perturbation. Ships a drop-in Inspect AI adapter, native metrics, and a CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Robert Morong" }]
keywords = ["ai-evaluation", "robustness", "inspect-ai", "benchmarks", "reproducibility", "ai-safety"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
inspect = ["inspect_ai>=0.3"]
# inspect_ai requires Python >=3.10; the marker lets the pure core still test on 3.9.
dev = ["pytest>=7", "inspect_ai>=0.3; python_version >= '3.10'"]

[project.scripts]
invariance-check = "eval_invariance_engine.cli:main"

[project.urls]
Homepage = "https://github.com/GrobeStreet/eval-invariance-engine"
Lineage = "https://github.com/GrobeStreet/mmlu-robustness-audit"

[tool.setuptools]
packages = ["eval_invariance_engine"]
